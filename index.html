<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사진보드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0047AB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사진보드">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --sub: #6b7280; --line: #d1d5db;
    --btn: #f9fafb; --blue: #0047AB; --green: #34a853; --gray: #5f6368; --red: #ea4335;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315; --card: #1c1f23; --text: #f3f4f6; --sub: #9ca3af; --line: #374151; --btn: #262a2f; --blue: #2f6fd6;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { padding: 16px; background: var(--bg); color: var(--text); font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 14px; color: var(--blue); }
  .card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .label { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .head .label { margin: 0; }
  .edit { padding: 2px 8px; font-size: 12px; border-radius: 8px; color: var(--sub); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { position: relative; flex: 1 1 28%; }
  .chip > button { width: 100%; }
  .chip .x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border-radius: 50%; background: var(--red); color: #fff; border: none; font-size: 13px; line-height: 22px; }
  button { padding: 12px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--btn); color: var(--text); font-size: 15px; cursor: pointer; font-family: inherit; }
  .chip > button.on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
  .addBtn { flex: 1 1 28%; border-style: dashed; color: var(--sub); }
  .addBox { display: none; gap: 8px; margin-top: 8px; }
  .addBox input { flex: 1; margin: 0; }
  .addBox button { background: var(--blue); color: #fff; border: none; font-weight: 700; padding: 0 16px; }
  input[type=date], input[type=text], textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; margin-bottom: 10px; font-family: inherit; background: var(--card); color: var(--text); }
  textarea { height: 80px; resize: none; margin-bottom: 0; }
  .btnCam, .btnAlb { flex: 1 1 45%; color: #fff; border: none; font-weight: 700; }
  .btnCam { background: var(--green); }
  .btnAlb { background: var(--gray); }
  .saveRow { display: flex; gap: 8px; }
  .saveRow button { flex: 1; padding: 16px 8px; background: var(--blue); color: #fff; border: none; font-size: 16px; font-weight: 700; }
  #shareBtn { background: var(--gray); }
  .saveRow button:disabled { background: #aaa; }
  canvas { width: 100%; border-radius: 10px; display: none; background: #000; }
  #result { display: none; }
  #result img { width: 100%; border-radius: 10px; -webkit-touch-callout: default; }
  #msg { text-align: center; font-size: 14px; margin: 10px 0; color: var(--sub); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 사진보드</h1>

  <div class="card">
    <div class="head"><div class="label">사진 구분</div><button class="edit" data-edit="gubun">편집</button></div>
    <div class="row" id="gubunRow"></div>
    <div class="addBox" id="gubunAdd"><input type="text" placeholder="새 구분 이름"><button>추가</button></div>
  </div>

  <div class="card">
    <div class="head"><div class="label">공종</div><button class="edit" data-edit="gong">편집</button></div>
    <div class="row" id="gongRow"></div>
    <div class="addBox" id="gongAdd"><input type="text" placeholder="새 공종 이름"><button>추가</button></div>
  </div>

  <div class="card">
    <div class="label">일자</div>
    <input type="date" id="date">
    <div class="label">위치</div>
    <input type="text" id="loc" placeholder="예) B2 전기실">
    <div class="label">내용</div>
    <textarea id="content" placeholder="내용 입력 / 작성자명"></textarea>
  </div>

  <div class="card">
    <div class="row">
      <button class="btnCam" id="camBtn">📸 촬영</button>
      <button class="btnAlb" id="albBtn">🖼 앨범</button>
    </div>
    <input type="file" id="camIn" accept="image/*" capture="environment">
    <input type="file" id="albIn" accept="image/*">
  </div>

  <div class="card" id="prevCard" style="display:none"><canvas id="cv"></canvas></div>

  <div class="saveRow">
    <button id="saveBtn" disabled>💾 파일 저장</button>
    <button id="shareBtn" disabled>📱 사진첩/공유</button>
  </div>
  <div id="msg"></div>

  <div class="card" id="result">
    <div class="label">저장이 안 되면 사진을 길게 눌러서(PC는 우클릭) 저장</div>
    <img id="resImg" alt="합성된 사진">
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv');
const ctx = cv.getContext('2d');
let img = null;

// 구분/공종 목록 (첫 항목은 기본값이라 삭제 불가)
const G = {
  gubun: { list: ['사진'], cur: '사진', editing: false, row: 'gubunRow', add: 'gubunAdd' },
  gong:  { list: ['기본'], cur: '기본', editing: false, row: 'gongRow',  add: 'gongAdd' }
};

function store() {
  try {
    localStorage.setItem('photoBoard', JSON.stringify({
      gubun: { list: G.gubun.list, cur: G.gubun.cur },
      gong: { list: G.gong.list, cur: G.gong.cur },
      loc: $('loc').value
    }));
  } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('photoBoard') || '{}');
    ['gubun', 'gong'].forEach(k => {
      if (s[k] && Array.isArray(s[k].list) && s[k].list.length) {
        G[k].list = s[k].list;
        G[k].cur = s[k].list.includes(s[k].cur) ? s[k].cur : s[k].list[0];
      }
    });
    if (s.loc) $('loc').value = s.loc;
  } catch (e) {}
}

function build(k) {
  const g = G[k];
  const row = $(g.row);
  row.innerHTML = '';
  g.list.forEach((name, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    const b = document.createElement('button');
    b.textContent = name;
    if (name === g.cur) b.classList.add('on');
    b.onclick = () => { g.cur = name; store(); build(k); render(); };
    chip.appendChild(b);
    if (g.editing && i > 0) {
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = '×';
      x.onclick = () => {
        g.list.splice(i, 1);
        if (g.cur === name) g.cur = g.list[0];
        store(); build(k); render();
      };
      chip.appendChild(x);
    }
    row.appendChild(chip);
  });
  const plus = document.createElement('button');
  plus.className = 'addBtn chip';
  plus.textContent = '＋ 새로';
  plus.onclick = () => {
    const box = $(g.add);
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    if (box.style.display === 'flex') box.querySelector('input').focus();
  };
  row.appendChild(plus);
}

['gubun', 'gong'].forEach(k => {
  const box = $(G[k].add);
  const input = box.querySelector('input');
  const addIt = () => {
    const v = input.value.trim().slice(0, 20);
    if (!v) return;
    if (!G[k].list.includes(v)) G[k].list.push(v);
    G[k].cur = v;
    input.value = '';
    box.style.display = 'none';
    store(); build(k); render();
  };
  box.querySelector('button').onclick = addIt;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addIt(); });
});

document.querySelectorAll('.edit').forEach(b => {
  b.onclick = () => {
    const k = b.dataset.edit;
    G[k].editing = !G[k].editing;
    b.textContent = G[k].editing ? '완료' : '편집';
    build(k);
  };
});

function pad2(n) { return String(n).padStart(2, '0'); }
(function () {
  const d = new Date();
  $('date').value = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
})();

load();
build('gubun');
build('gong');
['date', 'loc', 'content'].forEach(id => $(id).addEventListener('input', render));
$('loc').addEventListener('change', store);

$('camBtn').onclick = () => $('camIn').click();
$('albBtn').onclick = () => $('albIn').click();

function loadFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => {
    img = im;
    $('result').style.display = 'none';
    $('msg').textContent = '';
    render();
    $('saveBtn').disabled = false;
    $('shareBtn').disabled = false;
    URL.revokeObjectURL(url);
  };
  im.src = url;
  e.target.value = '';
}
$('camIn').onchange = loadFile;
$('albIn').onchange = loadFile;

function wrap(text, maxW) {
  const lines = [];
  String(text).split('\n').forEach(para => {
    let line = '';
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
      else line += ch;
    }
    lines.push(line);
  });
  return lines;
}

function render() {
  if (!img) return;
  const MAX = 1600;
  const s = Math.min(1, MAX / Math.max(img.width, img.height));
  const W = Math.round(img.width * s), H = Math.round(img.height * s);
  cv.width = W; cv.height = H;
  cv.style.display = 'block';
  $('prevCard').style.display = 'block';
  ctx.drawImage(img, 0, 0, W, H);

  const rows = [
    ['공종', G.gong.cur],
    ['위치', $('loc').value || '-'],
    ['내용', $('content').value || '-'],
    ['일자', $('date').value]
  ];
  const fs = Math.max(14, Math.round(W * 0.028));
  const pad = Math.round(fs * 0.4);
  const labelW = Math.round(fs * 2.8);
  const tableW = Math.round(W * 0.45);
  const valueW = tableW - labelW - pad * 2;
  ctx.font = fs + 'px "Malgun Gothic", "Noto Sans KR", sans-serif';
  ctx.textBaseline = 'middle';

  const lineH = Math.round(fs * 1.3);
  const laid = rows.map(r => {
    const lines = wrap(r[1], valueW);
    return { label: r[0], lines: lines, h: lines.length * lineH + pad * 2 };
  });
  const totalH = laid.reduce((a, r) => a + r.h, 0);
  const x0 = W - tableW;
  let y = H - totalH;

  ctx.lineWidth = Math.max(1, Math.round(fs / 14));
  ctx.strokeStyle = '#333';
  laid.forEach(r => {
    ctx.fillStyle = '#e5e7eb';
    ctx.fillRect(x0, y, labelW, r.h);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x0 + labelW, y, tableW - labelW, r.h);
    ctx.strokeRect(x0, y, labelW, r.h);
    ctx.strokeRect(x0 + labelW, y, tableW - labelW, r.h);

    ctx.fillStyle = '#111';
    ctx.textAlign = 'center';
    ctx.fillText(r.label, x0 + labelW / 2, y + r.h / 2);
    ctx.textAlign = 'left';
    r.lines.forEach((ln, i) => {
      ctx.fillText(ln, x0 + labelW + pad, y + pad + lineH * i + lineH / 2);
    });
    y += r.h;
  });
}

function fileName() {
  const c = s => String(s || '').replace(/[\\/:*?"<>|\n\r]/g, ' ').trim().slice(0, 20);
  const d = new Date();
  const t = pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
  return [$('date').value, c(G.gubun.cur), c(G.gong.cur), c($('loc').value) || '위치없음', t].join('_') + '.jpg';
}

// 다운로드 폴더로 파일 저장
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// 파일 저장: 다운로드 폴더로 저장
$('saveBtn').onclick = () => {
  if (!img) return;
  store();
  const name = fileName();
  cv.toBlob(blob => {
    if (!blob) { $('msg').textContent = '❌ 사진 만들기 실패'; return; }
    $('resImg').src = URL.createObjectURL(blob);
    $('result').style.display = 'block';
    try {
      downloadBlob(blob, name);
      $('msg').textContent = '✅ 저장 요청됨: ' + name + ' (안 보이면 아래 사진을 길게 눌러 저장)';
    } catch (e) {
      $('msg').textContent = '저장이 막히면 아래 사진을 길게 눌러서(PC는 우클릭) 저장해줘.';
    }
  }, 'image/jpeg', 0.88);
};

// 사진첩/공유: 폰 공유창
$('shareBtn').onclick = () => {
  if (!img) return;
  store();
  const name = fileName();
  cv.toBlob(async blob => {
    if (!blob) { $('msg').textContent = '❌ 사진 만들기 실패'; return; }
    const file = new File([blob], name, { type: 'image/jpeg' });

    $('resImg').src = URL.createObjectURL(blob);
    $('result').style.display = 'block';

    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        $('msg').textContent = '✅ 저장/공유 완료: ' + name;
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') { $('msg').textContent = '취소됨'; return; }
    }

    try { downloadBlob(blob, name); } catch (e) {}
    $('msg').textContent = '공유창이 안 열려. 💾 버튼을 쓰거나 아래 사진을 길게 눌러 저장해줘.';
  }, 'image/jpeg', 0.88);
};

// PWA: 서비스워커 등록 (HTTPS 또는 localhost에서만 동작)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
